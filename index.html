<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" content="notranslate" />
    <title>Simple Roguelike</title>
    <link rel="stylesheet" href="src/style.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <div id="stage">
      <h1>Simple Roguelike</h1>
      <div id="game">
        <pre id="status" aria-live="polite"></pre>
        <div id="map-wrap">
          <pre id="map" aria-label="Game map"></pre>
          <div id="overlay" hidden></div>
        </div>
        <pre id="log" aria-live="polite"></pre>
        <p id="help">
          Move: arrows, WASD or hjkl &middot; Attack: walk into a monster &middot; Wait: . or space
          &middot; Descend: &gt; &middot; Drink potion: q
        </p>
      </div>
    </div>
  </body>
</html>
